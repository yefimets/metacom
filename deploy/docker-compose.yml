# Hub on a VPS behind Caddy, which gets a Let's Encrypt certificate for HUB_DOMAIN and
# terminates TLS, so agents and the phone connect over wss://. The hub itself is not
# exposed; only Caddy publishes ports 80 and 443.
#
#   cp .env.example .env && edit HUB_DOMAIN
#   docker compose up -d --build
#   docker compose exec hub cat /data/bootstrap-token.txt   # once, then delete it
services:
  hub:
    build:
      context: ../..
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: 8900
      HUB_DATA: /data
      HUB_CORS: https://${HUB_DOMAIN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUB_ROUTER_MODEL: ${HUB_ROUTER_MODEL:-google/gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER: ${TELEGRAM_OWNER:-}
    volumes:
      - hub-data:/data
    expose:
      - "8900"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub

volumes:
  hub-data:
  caddy-data:
  caddy-config:
