# metacom on a VPS behind Caddy, which gets a Let's Encrypt certificate for MC_DOMAIN and
# terminates TLS, so agents and the phone connect over wss://. metacom itself is not
# exposed; only Caddy publishes ports 80 and 443.
#
#   cp .env.example .env && edit MC_DOMAIN
#   docker compose up -d --build
#   docker compose exec metacom cat /data/bootstrap-token.txt   # once, then delete it
services:
  metacom:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MC_HOST: 0.0.0.0
      MC_PORT: 8900
      MC_DATA: /data
      MC_CORS: https://${MC_DOMAIN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER: ${TELEGRAM_OWNER:-}
    volumes:
      - data:/data
    expose:
      - "8900"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MC_DOMAIN: ${MC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - metacom

volumes:
  data:
  caddy-data:
  caddy-config:
