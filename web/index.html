<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Agent Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#111; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --busy:#d97706; --off:#9ca3af; --me:#dbeafe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --fg:#e5e7eb; --muted:#9ca3af; --line:#2a2f3a; --accent:#60a5fa; --me:#1e3a5f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding: max(10px, env(safe-area-inset-top)) 14px 8px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:16px; margin:0; flex:1; }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--off); }
  #dot.on { background:var(--ok); }
  select, button, textarea, input { font:inherit; color:inherit; }
  #room { background:transparent; border:1px solid var(--line); border-radius:8px; padding:4px 8px; }
  #agents { display:flex; gap:8px; overflow-x:auto; padding:10px 14px; scrollbar-width:none; }
  .agent { flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; min-width:120px; }
  .agent b { display:flex; align-items:center; gap:6px; }
  .agent i { width:8px; height:8px; border-radius:50%; background:var(--off); display:inline-block; }
  .agent.waiting i { background:var(--ok); } .agent.working i { background:var(--busy); } .agent.starting i { background:var(--accent); }
  .agent.blocked { border-color:#dc2626; } .agent.blocked i { background:#dc2626; }
  .agent.done { border-color:var(--ok); }
  .agent em { font-style:normal; font-size:11px; color:#fff; background:#dc2626; border-radius:6px; padding:0 6px; margin-left:auto; }
  .agent.done em { background:var(--ok); }
  .agent button { margin-top:6px; font-size:12px; border:1px solid var(--line); background:transparent; border-radius:8px; padding:2px 8px; }
  #screen { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; }
  #screen header { justify-content:space-between; }
  #screen pre { flex:1; margin:0; padding:12px 14px; overflow:auto; font:12px/1.35 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  #screen .keys { display:flex; gap:6px; padding:8px 14px max(8px, env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); overflow-x:auto; }
  #screen .keys button { border:1px solid var(--line); background:transparent; border-radius:8px; padding:6px 10px; white-space:nowrap; }
  .msg.system { background:transparent; border:0; color:var(--muted); font-size:12px; align-self:center; }
  .agent small { color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  #stream { flex:1; overflow-y:auto; padding:6px 14px 12px; display:flex; flex-direction:column; gap:6px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; max-width:92%; align-self:flex-start; white-space:pre-wrap; word-break:break-word; }
  .msg.mine { background:var(--me); align-self:flex-end; }
  .msg .meta { color:var(--muted); font-size:12px; margin-bottom:2px; }
  .msg .meta .to { color:var(--accent); }
  form { display:flex; gap:8px; padding:10px 14px max(10px, env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); }
  #target { max-width:38%; background:transparent; border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
  #text { flex:1; resize:none; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:transparent; min-height:40px; max-height:120px; }
  #send { border:0; background:var(--accent); color:#fff; border-radius:10px; padding:0 14px; }
  #login { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; justify-content:center; padding:24px; gap:12px; }
  #login input { padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  #login button { padding:10px; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  #login p { color:var(--muted); font-size:13px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><span id="dot"></span><h1>Agent Hub</h1><select id="room"></select></header>
<div id="agents"></div>
<div id="stream"></div>
<form id="composer">
  <select id="target"><option value="auto">auto</option><option value="room">room</option></select>
  <textarea id="text" rows="1" placeholder="Instruction for an agent…" enterkeyhint="send"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<div id="screen" class="hidden">
  <header><h1 id="screenTitle">Screen</h1><button id="screenClose" type="button">Close</button></header>
  <pre id="screenText"></pre>
  <div class="keys">
    <button data-cmd="!keys enter">Enter</button><button data-cmd="!keys esc">Esc</button><button data-cmd="!keys y">y</button>
    <button data-cmd="!keys up">↑</button><button data-cmd="!keys down">↓</button><button data-cmd="!cancel">Cancel turn</button>
    <button id="screenRefresh" type="button">Refresh</button>
  </div>
</div>
<div id="login">
  <h2>Agent Hub</h2>
  <p>Paste your owner token. It stays in this browser only.</p>
  <input id="token" type="password" placeholder="token" autocomplete="off">
  <button id="loginBtn">Connect</button>
  <p id="loginError"></p>
</div>
<script src="/app.js"></script>
</body>
</html>
