<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#282c34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="metacom">
<title>metacom</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<!--
  The terminal chat (cli/src/chat), drawn in a browser: the same font, the same colours (termcn's
  default theme on a One Dark terminal), the same lines — a coloured name and the time over the
  text, ↩ reply ↪ forward under it, the members on the line above a rounded input with a ❯, the
  hint under it, the room list in place of the conversation. Only what a terminal cannot do is
  added: a rooms button under the input on a phone.
-->
<style>
  /* JetBrains Mono, Ghostty's own font, served from the hub (fonts/, OFL): a phone has no copy,
     and it is what the terminal chat is read in. Latin and Cyrillic, regular and bold, italic. */
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-latin-400-italic.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: italic; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-latin-700-italic.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  :root {
    --bg: #282c34;
    --fg: #ffffff;
    --muted: #9ca3af;
    --border: #4b5563;
    --primary: #7c3aed;
    --accent: #8b5cf6;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --info: #3b82f6;
    --mono: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --gutter: 2ch;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--mono); font-variant-ligatures: none;
    position: fixed; top: 0; left: 0; width: 100%; height: var(--vh, 100dvh);
    transform: translateY(var(--vv-top, 0px));
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* a phone: one smaller size for everything, the input included (maximum-scale=1 keeps iOS
     from zooming in on a field under 16px) */
  @media (max-width: 640px) { body { font-size: 12px; --gutter: 1ch; } }
  body.keyboard { padding-bottom: 0; }
  ::selection { background: var(--primary); color: #fff; }
  button, textarea, input { font: inherit; color: inherit; background: none; border: 0; outline: 0; margin: 0; padding: 0; }
  button { cursor: pointer; text-align: left; }
  .muted { color: var(--muted); }
  .b { font-weight: 700; }
  .primary { color: var(--primary); }
  .accent { color: var(--accent); }
  .success { color: var(--success); }
  .warning { color: var(--warning); }
  .error { color: var(--error); }

  /* the conversation, bottom-pinned like the terminal's scrollback */
  #app { display: contents; }
  #feed { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 1ch 0 var(--gutter); display: flex; flex-direction: column; }
  #feed > .spacer { flex: 1; }
  .entry { white-space: pre-wrap; word-break: break-word; }
  .entry.message, .entry.note-keep { margin-bottom: 1.45em; }
  .entry.system + .entry.system { margin-top: 0; }
  .entry.system { margin-bottom: 0; }
  .entry.system:last-child, .entry.system:has(+ .entry:not(.system)) { margin-bottom: 1.45em; }
  .head .name, .name { font-weight: 700; }
  .head .arrow { margin: 0 1ch; }
  .actions { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions button { color: var(--muted); margin-right: 2ch; }
  .actions button:hover { color: var(--fg); }
  .body .code { color: var(--accent); }
  .body .quote, .body .bullet, .body .rule { color: var(--muted); }
  .body .line { min-height: 1.45em; }
  .body .hang { display: block; padding-left: var(--hang, 0); text-indent: calc(-1 * var(--hang, 0)); }
  .body a.link, .body button.link { color: var(--info); text-decoration: underline; text-underline-offset: 2px; }
  .body button.mention { font-weight: 700; }
  .banner { padding: 1.45em 1ch 1.45em 1ch; }
  .rule-now { padding-left: 2ch; color: var(--muted); margin-bottom: 0; }
  .block { padding-left: 2ch; margin-bottom: 1.45em; white-space: pre; overflow-x: auto; }
  .screen { border-left: 1px solid var(--border); padding-left: 1ch; color: var(--muted); }

  /* the room list, in the conversation's place */
  #rooms { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1ch 0 var(--gutter); display: none; flex-direction: column; justify-content: flex-end; }
  body.picking #rooms { display: flex; }
  body.picking #feed { display: none; }
  #rooms .title { color: var(--muted); margin-bottom: 1.45em; }
  #rooms .row { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rooms .row .room { display: inline-block; min-width: var(--nameW, 10ch); }
  #rooms .row.active .room { color: var(--primary); font-weight: 700; }
  #rooms .row .mark { color: var(--primary); display: inline-block; width: 2ch; }

  /* the line above the input */
  /* Spacing is the terminal's grid: a row is 1.45em, a column 1ch. The live area sits in the
     chat's gutter; the status line pads one column more, the hint two; the box's border rows are
     half a row of air above and below the text inside it and around it. */
  #status { display: flex; justify-content: space-between; gap: 2ch; padding: 0 1ch 0 calc(var(--gutter) + 1ch); white-space: nowrap; }
  #status .who { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #status .who button { margin-right: 3ch; }
  #status .me { flex: 0 0 auto; color: var(--muted); }
  #status .me .room { color: var(--fg); font-weight: 700; }

  /* the list over the input for @ and / */
  #popup { padding-left: calc(var(--gutter) + 2ch); display: none; }
  #popup.open { display: block; }
  #popup .item { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #popup .item .mark { color: var(--primary); display: inline-block; width: 2ch; }
  #popup .item.active .label { font-weight: 700; }
  #popup .hint { color: var(--muted); }

  /* the input: a rounded box, ❯ in the primary colour */
  #composer { margin: 0.725em 1ch 0.725em var(--gutter); border: 1px solid var(--border); border-radius: 4px; padding: 0.725em 1ch; display: flex; align-items: flex-start; }
  #composer:focus-within { border-color: #6b7280; }
  #composer .prompt { color: var(--primary); font-weight: 700; flex: 0 0 2ch; line-height: 1.45; }
  #text { flex: 1; resize: none; min-height: 1.45em; max-height: calc(6 * 1.45em); line-height: 1.45; overflow-y: auto; caret-color: var(--fg); }
  #text::placeholder { color: var(--muted); opacity: 1; }
  /* the terminal's cursor: a white block over the character, inverting it, blinking; the
     browser's thin caret is hidden. Solid while typing, blinking once it rests. */
  #composer { position: relative; }
  #text { caret-color: transparent; }
  #cursor { position: absolute; width: 1ch; height: 1.45em; background: #fff; mix-blend-mode: difference; pointer-events: none; display: none; }
  #cursor.on { display: block; }
  #cursor.rest { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #mirror { position: absolute; visibility: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.45; top: 0; left: 0; }

  /* the hint under it, and on a phone the rooms button */
  #footer { display: flex; align-items: center; gap: 2ch; padding: 0 1ch 0 calc(var(--gutter) + 2ch); min-height: 1.45em; margin-bottom: 0.725em; }
  #hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #roomsBtn { display: none; flex: 0 0 auto; color: var(--muted); padding: 0; }
  #roomsBtn:active { color: var(--fg); }
  @media (max-width: 820px), (pointer: coarse) { #roomsBtn { display: inline-block; } }

  /* sign in */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 0 3ch; gap: 0.8em; z-index: 10; }
  #login.hidden { display: none; }
  #login .field { display: flex; border: 1px solid var(--border); border-radius: 0.6em; padding: 0.3em 1ch; }
  #login .field .prompt { color: var(--primary); font-weight: 700; width: 2ch; }
  #login .field input { flex: 1; }
  #login input::placeholder { color: var(--muted); }
  #login .go { color: var(--primary); font-weight: 700; align-self: flex-start; }
  #loginError { color: var(--error); min-height: 1.45em; }
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/htm-preact.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
