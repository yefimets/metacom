<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#282c34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="metacom">
<title>metacom</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<!--
  The terminal chat (cli/src/chat), drawn in a browser: the same font, the same colours (termcn's
  default theme on a One Dark terminal), the same lines — a coloured name and the time over the
  text, ↩ reply ↪ forward under it, the members on the line above a rounded input with a ❯, the
  hint under it, the room list in place of the conversation. Only what a terminal cannot do is
  added: a rooms button under the input on a phone.
-->
<style>
  :root {
    --bg: #282c34;
    --fg: #ffffff;
    --muted: #9ca3af;
    --border: #4b5563;
    --primary: #7c3aed;
    --accent: #8b5cf6;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --info: #3b82f6;
    --mono: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --gutter: 2ch;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--mono); font-variant-ligatures: none;
    position: fixed; top: 0; left: 0; width: 100%; height: var(--vh, 100dvh);
    transform: translateY(var(--vv-top, 0px));
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  @media (max-width: 640px) { body { font-size: 13px; } }
  ::selection { background: var(--primary); color: #fff; }
  button, textarea, input { font: inherit; color: inherit; background: none; border: 0; outline: 0; margin: 0; padding: 0; }
  button { cursor: pointer; text-align: left; }
  .muted { color: var(--muted); }
  .b { font-weight: 700; }
  .primary { color: var(--primary); }
  .accent { color: var(--accent); }
  .success { color: var(--success); }
  .warning { color: var(--warning); }
  .error { color: var(--error); }

  /* the conversation, bottom-pinned like the terminal's scrollback */
  #feed { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 1ch 0 var(--gutter); display: flex; flex-direction: column; }
  #feed > .spacer { flex: 1; }
  .entry { white-space: pre-wrap; word-break: break-word; }
  .entry.message, .entry.note-keep { margin-bottom: 1.45em; }
  .entry.system + .entry.system { margin-top: 0; }
  .entry.system { margin-bottom: 0; }
  .entry.system:last-child, .entry.system:has(+ .entry:not(.system)) { margin-bottom: 1.45em; }
  .head .name, .name { font-weight: 700; }
  .head .arrow { margin: 0 1ch; }
  .actions { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions button { color: var(--muted); margin-right: 2ch; }
  .actions button:hover { color: var(--fg); }
  .body .code { color: var(--accent); }
  .body .quote, .body .bullet, .body .rule { color: var(--muted); }
  .body .line { min-height: 1.45em; }
  .body .hang { display: block; padding-left: var(--hang, 0); text-indent: calc(-1 * var(--hang, 0)); }
  .body a.link, .body button.link { color: var(--info); text-decoration: underline; text-underline-offset: 2px; }
  .body button.mention { font-weight: 700; }
  .banner { padding: 1.45em 1ch 1.45em 1ch; }
  .rule-now { padding-left: 2ch; color: var(--muted); margin-bottom: 0; }
  .block { padding-left: 2ch; margin-bottom: 1.45em; white-space: pre; overflow-x: auto; }
  .screen { border-left: 1px solid var(--border); padding-left: 1ch; color: var(--muted); }

  /* the room list, in the conversation's place */
  #rooms { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1ch 0 var(--gutter); display: none; flex-direction: column; justify-content: flex-end; }
  body.picking #rooms { display: flex; }
  body.picking #feed { display: none; }
  #rooms .title { color: var(--muted); margin-bottom: 1.45em; }
  #rooms .row { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rooms .row .room { display: inline-block; min-width: var(--nameW, 10ch); }
  #rooms .row.active .room { color: var(--primary); font-weight: 700; }
  #rooms .row .mark { color: var(--primary); display: inline-block; width: 2ch; }

  /* the line above the input */
  #status { display: flex; justify-content: space-between; gap: 2ch; padding: 0 1ch; white-space: nowrap; }
  #status .who { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #status .who button { margin-right: 3ch; }
  #status .me { flex: 0 0 auto; color: var(--muted); }
  #status .me .room { color: var(--fg); font-weight: 700; }

  /* the list over the input for @ and / */
  #popup { padding-left: 2ch; display: none; }
  #popup.open { display: block; }
  #popup .item { display: block; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #popup .item .mark { color: var(--primary); display: inline-block; width: 2ch; }
  #popup .item.active .label { font-weight: 700; }
  #popup .hint { color: var(--muted); }

  /* the input: a rounded box, ❯ in the primary colour */
  #composer { margin: 0 0 0 var(--gutter); border: 1px solid var(--border); border-radius: 0.6em; padding: 0 1ch; display: flex; align-items: flex-start; margin-right: 1ch; }
  #composer .prompt { color: var(--primary); font-weight: 700; flex: 0 0 2ch; line-height: 1.45; padding: 0.2em 0; }
  #text { flex: 1; resize: none; min-height: 1.45em; max-height: calc(6 * 1.45em); line-height: 1.45; padding: 0.2em 0; overflow-y: auto; caret-color: var(--fg); }
  #text::placeholder { color: var(--muted); opacity: 1; }
  @media (pointer: coarse) { #text { font-size: 16px; } }

  /* the hint under it, and on a phone the rooms button */
  #footer { display: flex; align-items: center; justify-content: space-between; gap: 1ch; padding: 0 1ch 0 calc(var(--gutter) + 0ch); min-height: 1.45em; }
  #hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-left: 2ch; }
  #roomsBtn { display: none; flex: 0 0 auto; color: var(--muted); border: 1px solid var(--border); border-radius: 0.6em; padding: 0.3em 1.2ch; margin: 0.4em 0; }
  #roomsBtn:active { color: var(--fg); border-color: var(--fg); }
  @media (max-width: 820px), (pointer: coarse) { #roomsBtn { display: inline-block; } }

  /* sign in */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 0 3ch; gap: 0.8em; z-index: 10; }
  #login.hidden { display: none; }
  #login .field { display: flex; border: 1px solid var(--border); border-radius: 0.6em; padding: 0.3em 1ch; }
  #login .field .prompt { color: var(--primary); font-weight: 700; width: 2ch; }
  #login .field input { flex: 1; }
  #login input::placeholder { color: var(--muted); }
  #login .go { color: var(--primary); font-weight: 700; align-self: flex-start; }
  #loginError { color: var(--error); min-height: 1.45em; }
</style>
</head>
<body>
<div id="feed"><div class="spacer"></div></div>
<div id="rooms"></div>
<div id="status"><span class="who"></span><span class="me"></span></div>
<div id="popup"></div>
<div id="composer"><span class="prompt">❯</span><textarea id="text" rows="1" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></div>
<div id="footer"><span id="hint" class="muted"></span><button id="roomsBtn" type="button">← rooms</button></div>
<input id="fileInput" type="file" multiple hidden>

<div id="login">
  <div><span class="b primary">metacom</span><span class="muted"> · sign in</span></div>
  <label class="field"><span class="prompt">❯</span><input id="token" type="password" placeholder="token" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label class="field"><span class="prompt">❯</span><input id="name" placeholder="your name, e.g. misha" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <button id="loginBtn" class="go" type="button">connect ⏎</button>
  <div id="loginError"></div>
</div>
<script src="app.js"></script>
</body>
</html>
