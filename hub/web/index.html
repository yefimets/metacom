<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="metacom">
<title>metacom</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #888;
    --faint: #333;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; border-radius: 0 !important; -webkit-tap-highlight-color: transparent; }
  /* iOS Safari inflates text in wide blocks ("font boosting"): the stream came out at ~24px
     while the header stayed at 14. Pin the size. */
  html { height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* The body is pinned to the visual viewport: app.js keeps --vh and --vv-top in step with
     the on-screen keyboard on iOS, where the layout viewport does not shrink. */
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--mono);
    position: fixed; top: 0; left: 0; width: 100%; height: var(--vh, 100dvh);
    transform: translateY(var(--vv-top, 0px));
    display: flex; flex-direction: column; overflow: hidden;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; background: transparent; border: 0; outline: 0; margin: 0; appearance: none; -webkit-appearance: none; }
  /* iOS Safari zooms the page when a focused field is set below 16px; keep fields at 16px on touch. */
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px; }
    header .field > select { font-size: 16px; }
  }
  button { cursor: pointer; }

  /* logo: five pixel lines meeting in the centre. .spin makes it the loader. */
  .logo { width: 28px; height: 28px; display: block; flex: 0 0 auto; fill: currentColor; }
  #logo-def { position: absolute; width: 0; height: 0; overflow: hidden; }
  .spin { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* buttons: white block, black text, uppercase */
  .btn {
    background: var(--fg); color: var(--bg); border: 1px solid var(--fg);
    padding: 0 12px; height: 36px; line-height: 34px; text-transform: uppercase; letter-spacing: .04em;
    font-size: 12px; white-space: nowrap; user-select: none;
  }
  .btn:active { background: var(--bg); color: var(--fg); }
  .btn:disabled { opacity: .35; }
  .btn.ghost { background: var(--bg); color: var(--fg); }
  .btn.ghost:active { background: var(--fg); color: var(--bg); }

  /* terminal inputs: black, white border, prompt glyph in front */
  .field { display: flex; align-items: stretch; border: 1px solid var(--fg); background: var(--bg); min-width: 0; }
  .field > .prompt { padding: 0 0 0 10px; display: flex; align-items: center; color: var(--fg); user-select: none; }
  .field > input, .field > textarea, .field > select { flex: 1; min-width: 0; padding: 8px 10px; caret-color: var(--fg); }
  .field > textarea { resize: none; line-height: 1.4; max-height: 40dvh; }
  .field > input::placeholder, .field > textarea::placeholder { color: var(--faint); }
  .field > select { appearance: none; -webkit-appearance: none; padding-right: 26px; }
  .field.select { position: relative; }
  .field.select::after { content: "v"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; font-size: 11px; }
  .field:focus-within { box-shadow: inset 0 0 0 1px var(--fg); }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--fg);
  }
  header .title { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .spacer { flex: 1; }
  header #state { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  header #state.on { color: var(--fg); }
  header .field { height: 32px; flex: 0 1 auto; min-width: 0; }
  header .field > select { padding: 0 26px 0 8px; font-size: 12px; text-transform: uppercase; text-overflow: ellipsis; }

  /* agent strip */
  #agents { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--fg); flex: 0 0 auto; }
  #agents::-webkit-scrollbar { display: none; }
  #agents:empty { display: none; }
  .agent {
    flex: 0 0 auto; min-width: 132px; max-width: 200px; padding: 10px 12px; border-right: 1px solid var(--fg);
    display: flex; flex-direction: column; gap: 4px; position: relative;
  }
  .agent .name { display: flex; align-items: center; gap: 7px; font-weight: 700; letter-spacing: .02em; min-width: 0; }
  .agent .name > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .glyph { width: 12px; height: 12px; display: inline-block; flex: 0 0 auto; }
  .agent .glyph .logo { width: 12px; height: 12px; }
  .agent .glyph.idle { border: 1px solid var(--fg); }
  .agent .glyph.waiting { background: var(--fg); }
  .agent .glyph.stopped { border: 1px solid var(--faint); }
  .agent .glyph.starting { border: 1px dashed var(--fg); }
  .agent .meta { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent .tag { position: absolute; top: 0; right: 0; font-size: 10px; padding: 1px 5px; text-transform: uppercase; letter-spacing: .06em; background: var(--fg); color: var(--bg); }
  .agent.blocked { background: var(--fg); color: var(--bg); }
  .agent.blocked .meta { color: #444; }
  .agent.blocked .glyph { background: var(--bg); border: 0; }
  .agent.blocked .tag { background: var(--bg); color: var(--fg); }
  .agent.stopped { color: var(--dim); }
  .agent .row { display: flex; gap: 6px; margin-top: 4px; }
  .agent .row .btn { height: 26px; line-height: 24px; padding: 0 8px; font-size: 10px; }
  @media (pointer: coarse) { .agent .row .btn { height: 32px; line-height: 30px; padding: 0 12px; } }
  .agent.blocked .row .btn { background: var(--bg); color: var(--fg); border-color: var(--bg); }
  .agent.selected { box-shadow: inset 0 -3px 0 0 var(--fg); }
  .agent.blocked.selected { box-shadow: inset 0 -3px 0 0 var(--bg); }

  /* stream */
  #streamWrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #stream { flex: 1; overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 2px; overscroll-behavior: contain; }
  /* unread pill: sits over the bottom of the stream, jumps to the first unread message */
  #unread { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; height: 32px; line-height: 30px; padding: 0 14px; }
  .msg { white-space: pre-wrap; word-break: break-word; padding: 3px 0; }
  .msg .meta { color: var(--dim); font-size: 11px; }
  .msg .meta .from { color: var(--fg); }
  .msg .meta .to::before { content: " > "; color: var(--dim); }
  .msg .meta .to { color: var(--fg); }
  .msg .meta .kind { color: var(--dim); }
  .msg.mine { border-left: 2px solid var(--fg); padding-left: 10px; }
  .msg.system { color: var(--dim); font-size: 11px; }
  .msg.system::before { content: "-- "; }
  #stream .empty { color: var(--faint); margin: auto; text-align: center; }

  /* composer */
  #composer { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid var(--fg); }
  /* with the keyboard up the home-indicator inset is under the keyboard, not under us */
  body.keyboard #composer, body.keyboard #screen .keys { padding-bottom: 10px; }
  #composer .line { display: flex; gap: 8px; align-items: stretch; }
  #composer .field.text { flex: 1; }
  #composer #send { flex: 0 0 auto; height: auto; min-height: 36px; }
  #composer #attach { flex: 0 0 auto; height: auto; min-height: 36px; width: 36px; padding: 0; font-size: 18px; line-height: 34px; text-align: center; }
  #composer #attach input { display: none; }
  /* files queued for the next message: thumbnails with a corner × */
  #files { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #files::-webkit-scrollbar { display: none; }
  #files .file { position: relative; flex: 0 0 auto; width: 56px; height: 56px; border: 1px solid var(--fg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #files .file img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #files .file .ext { font-size: 10px; text-transform: uppercase; color: var(--dim); padding: 0 4px; text-align: center; word-break: break-all; }
  #files .file .x { position: absolute; top: 0; right: 0; width: 18px; height: 18px; line-height: 18px; text-align: center; background: var(--fg); color: var(--bg); font-size: 12px; }
  body.dragging #composer { box-shadow: inset 0 0 0 2px var(--fg); }
  /* attachments on messages */
  .msg .media { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .msg .media img { max-width: min(100%, 320px); max-height: 240px; display: block; border: 1px solid var(--faint); }
  .msg .media a { color: var(--fg); }
  .msg .media a.doc { border: 1px solid var(--fg); padding: 4px 8px; font-size: 12px; text-decoration: none; }
  /* who gets the message: "@" in the input opens the member list; a tap fills the mention in */
  #mention { display: flex; flex-direction: column; border: 1px solid var(--fg); max-height: 40dvh; overflow-y: auto; }
  #mention button { display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--faint); }
  #mention button:last-child { border-bottom: 0; }
  #mention button:active, #mention button.current { background: var(--fg); color: var(--bg); }
  #mention button .name { font-weight: 700; }
  #mention button .meta { color: var(--dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  #mention button.current .meta { color: #444; }

  /* overlays */
  .overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10; }
  .hidden { display: none !important; }
  #screen pre {
    flex: 1; margin: 0; padding: 12px 16px; overflow: auto; font-size: 11px; line-height: 1.35;
    white-space: pre-wrap; word-break: break-all; color: var(--fg);
  }
  #screen .keys { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid var(--fg); }
  #screen .keys .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  #screen .keys .row::-webkit-scrollbar { display: none; }
  #screen .keys .btn { flex: 0 0 auto; }
  #screen header .btn { padding: 0 10px; }

  #login { justify-content: center; align-items: stretch; padding: 24px; gap: 14px; }
  #login .logo { width: 96px; height: 96px; margin: 0 auto 10px; }
  #login h1 { margin: 0; text-align: center; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700; }
  #login p { margin: 0; color: var(--dim); text-align: center; font-size: 12px; }
  #login .btn { height: 44px; line-height: 42px; }
  #login #loginError { color: var(--fg); min-height: 1.4em; }
  #login #loginError:not(:empty)::before { content: "! "; }

  #busy { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 16px; z-index: 20; pointer-events: none; }
  #busy .logo { width: 20px; height: 20px; }

  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 90px); z-index: 30; background: var(--fg); color: var(--bg); padding: 8px 12px; font-size: 12px; }
  #toast::before { content: "! "; }
</style>
</head>
<body>

<svg id="logo-def" xmlns="http://www.w3.org/2000/svg">
  <symbol id="mark" viewBox="0 0 21 21" shape-rendering="crispEdges">
    <path d="M10 0h1v1h-1zM10 1h1v1h-1zM4 2h1v1h-1zM10 2h1v1h-1zM16 2h1v1h-1zM5 3h1v1h-1zM10 3h1v1h-1zM15 3h1v1h-1zM6 4h1v1h-1zM10 4h1v1h-1zM14 4h1v1h-1zM6 5h1v1h-1zM10 5h1v1h-1zM14 5h1v1h-1zM7 6h1v1h-1zM10 6h1v1h-1zM13 6h1v1h-1zM1 7h2v1h-2zM8 7h1v1h-1zM10 7h1v1h-1zM12 7h1v1h-1zM18 7h2v1h-2zM3 8h3v1h-3zM8 8h5v1h-5zM15 8h3v1h-3zM6 9h9v1h-9zM9 10h3v1h-3zM6 11h9v1h-9zM3 12h3v1h-3zM8 12h5v1h-5zM15 12h3v1h-3zM1 13h2v1h-2zM8 13h1v1h-1zM10 13h1v1h-1zM12 13h1v1h-1zM18 13h2v1h-2zM7 14h1v1h-1zM10 14h1v1h-1zM13 14h1v1h-1zM6 15h1v1h-1zM10 15h1v1h-1zM14 15h1v1h-1zM6 16h1v1h-1zM10 16h1v1h-1zM14 16h1v1h-1zM5 17h1v1h-1zM10 17h1v1h-1zM15 17h1v1h-1zM4 18h1v1h-1zM10 18h1v1h-1zM16 18h1v1h-1zM10 19h1v1h-1zM10 20h1v1h-1z"/>
  </symbol>
</svg>

<header>
  <svg class="logo" id="headLogo"><use href="#mark"/></svg>
  <span class="title">metacom</span>
  <span class="spacer"></span>
  <span id="state" title="connection">offline</span>
  <label class="field select"><select id="room" aria-label="room"></select></label>
</header>

<div id="agents"></div>
<div id="streamWrap">
  <div id="stream"><div class="empty">no messages</div></div>
  <button id="unread" class="btn hidden" type="button"></button>
</div>

<form id="composer" autocomplete="off">
  <div id="files" class="hidden"></div>
  <div id="mention" class="hidden"></div>
  <div class="line">
    <label id="attach" class="btn ghost" title="attach a file">+<input id="fileInput" type="file" accept="image/*,.pdf,.txt,.md" multiple></label>
    <label class="field text"><textarea id="text" rows="1" placeholder="@agent instruction · paste or drop an image" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></label>
    <button id="send" class="btn" type="submit">send</button>
  </div>
</form>

<div id="screen" class="overlay hidden">
  <header>
    <svg class="logo"><use href="#mark"/></svg>
    <span class="title" id="screenTitle">screen</span>
    <span class="spacer"></span>
    <button id="screenRefresh" class="btn ghost" type="button">refresh</button>
    <button id="screenClose" class="btn" type="button">close</button>
  </header>
  <pre id="screenText"></pre>
  <div class="keys">
    <div class="row">
      <button class="btn" data-cmd="!keys enter">enter</button>
      <button class="btn" data-cmd="!keys esc">esc</button>
      <button class="btn" data-cmd="!keys y">y</button>
      <button class="btn" data-cmd="!keys up">up</button>
      <button class="btn" data-cmd="!keys down">down</button>
      <button class="btn ghost" data-cmd="!cancel">cancel</button>
    </div>
    <label class="field"><span class="prompt">&gt;</span><input id="screenType" placeholder="type into agent" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  </div>
</div>

<div id="login" class="overlay">
  <svg class="logo" id="loginLogo"><use href="#mark"/></svg>
  <h1>metacom</h1>
  <p>owner token. it stays in this browser.</p>
  <label class="field"><span class="prompt">&gt;</span><input id="token" type="password" placeholder="token" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></label>
  <button id="loginBtn" class="btn" type="button">connect</button>
  <p id="loginError"></p>
</div>

<div id="busy" class="hidden"><svg class="logo spin"><use href="#mark"/></svg></div>
<div id="toast" class="hidden"></div>

<script src="/app.js"></script>
</body>
</html>
